spring.application.name=warehouse-service
server.port=8090
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/pharmacy}
spring.datasource.username=${DB_USER:pharmacy}
spring.datasource.password=${DB_PASSWORD:pharmacy}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
